<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foco</title>
<style>
  :root {
    --bg: #fbfbfd; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --accent: #0071e3; --seg: rgba(120,120,128,.12); --shadow: 0 2px 12px rgba(0,0,0,.06);
    color-scheme: light;
  }
  /* escuro: segue o navegador, a não ser que o tema esteja travado em claro */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d;
      --accent: #2997ff; --seg: rgba(120,120,128,.24); --shadow: none; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d;
      --accent: #2997ff; --seg: rgba(120,120,128,.24); --shadow: none; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; line-height: 1.4;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 980px; margin: 0 auto; padding: 56px 24px 96px; }
  header h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 700; letter-spacing: -.03em; }
  header p { color: var(--muted); font-size: 19px; margin-top: 6px; }

  .tabs { display: inline-flex; gap: 2px; padding: 3px; margin: 36px 0 32px; background: var(--seg);
    border-radius: 10px; max-width: 100%; overflow-x: auto; }
  .tabs button { font: inherit; font-size: 14px; font-weight: 500; color: var(--text); border: 0;
    background: transparent; padding: 7px 18px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.15); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 28px 22px; }
  .card { cursor: pointer; background: none; border: 0; text-align: left; font: inherit; color: inherit; padding: 0; }
  .thumb { aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: var(--seg);
    box-shadow: var(--shadow); transition: transform .25s ease; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card:hover .thumb { transform: scale(1.02); }
  .card h3 { font-size: 16px; font-weight: 600; margin-top: 12px; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card.watched { opacity: .4; }

  .card-wrap { position: relative; }
  .star { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.45); color: #fff; font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    display: grid; place-items: center; opacity: 0; transition: opacity .2s ease;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .card-wrap:hover .star, .star:focus-visible, .star.on { opacity: 1; }
  .star.on { color: #ffd60a; }
  @media (hover: none) { .star { opacity: 1; } }    /* no toque não existe hover */
  .pill.on { background: rgba(255,214,10,.92); color: #000; }

  /* ---- visão por canal: raias horizontais, estilo pool de BPMN ---- */
  .raias { display: flex; flex-direction: column; gap: 14px; }
  .raia { display: grid; grid-template-columns: 136px 1fr; background: var(--card);
    border: 1px solid var(--seg); border-radius: 16px; overflow: hidden; }
  .raia-nome { display: flex; align-items: center; padding: 14px 13px; background: var(--seg);
    border-right: 1px solid var(--seg); font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .raia-fila { display: flex; gap: 14px; padding: 14px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .raia-fila .card-wrap { flex: 0 0 228px; scroll-snap-align: start; }
  .raia-fila .card h3 { font-size: 15px; }
  @media (max-width: 640px) {
    .raia { grid-template-columns: 1fr; }
    .raia-nome { border-right: 0; border-bottom: 1px solid var(--seg); padding: 11px 13px; }
    .raia-fila { padding: 12px; gap: 12px; }
    .raia-fila .card-wrap { flex: 0 0 188px; }
  }
  .search-btn.on { opacity: 1; color: var(--accent); }

  .msg { color: var(--muted); padding: 24px 0; }
  .end { text-align: center; margin-top: 72px; color: var(--muted); }
  .end strong { display: block; font-size: 22px; color: var(--text); font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
  .end button { font: inherit; font-size: 14px; color: var(--accent); background: none; border: 0; cursor: pointer; margin-top: 14px; }
  footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); }

  dialog { border: 0; padding: 0; background: transparent; width: min(960px, 94vw); max-width: none; overflow: visible; margin: auto; }
  dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .player { aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .player iframe { width: 100%; height: 100%; border: 0; }
  .bar { position: absolute; top: -44px; right: 0; left: 0; display: flex; justify-content: space-between; }
  .pill { font: inherit; font-size: 14px; color: #fff; background: rgba(255,255,255,.18); border: 0;
    border-radius: 999px; padding: 6px 16px; cursor: pointer; text-decoration: none; }

  /* ---- player de música ---- */
  .music { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); }
  .music-card { width: 216px; background: var(--card); border-radius: 18px; padding: 8px;
    box-shadow: 0 10px 34px rgba(0,0,0,.18); border: 1px solid var(--seg); }
  .music-video { width: 200px; height: 200px; border-radius: 12px; overflow: hidden; background: #000; }
  .music-video iframe { display: block; width: 200px; height: 200px; border: 0; }
  .music-row { display: flex; align-items: center; gap: 4px; padding: 8px 2px 2px; }
  .music-meta { flex: 1; min-width: 0; line-height: 1.25; }
  .music-meta strong { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-meta span, .music-meta a { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-meta a { color: var(--accent); text-decoration: none; }
  .icon-btn { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--seg); color: var(--text);
    display: grid; place-items: center; cursor: pointer; flex: none; font: inherit; font-size: 16px; line-height: 1; }
  .icon-btn:hover { background: var(--accent); color: #fff; }
  .music-pill { display: none; font: inherit; font-size: 13px; font-weight: 500; color: var(--text); background: var(--card);
    border: 1px solid var(--seg); border-radius: 999px; padding: 8px 14px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.14); }
  .music.min .music-card { display: none; }
  .music.min .music-pill { display: block; }

  /* ---- busca ---- */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .search-btn { flex: none; width: 34px; height: 34px; margin-top: 12px; border: 0; border-radius: 50%;
    background: var(--seg); color: var(--muted); display: grid; place-items: center; cursor: pointer;
    opacity: .3; transition: opacity .2s ease, color .2s ease; }
  .search-btn:hover, .search-btn:focus-visible { opacity: 1; color: var(--text); outline: 0; }
  .top-acoes { display: flex; flex: none; gap: 6px; }
  #themeBtn { font-size: 14px; }

  #search { width: min(640px, 94vw); margin: 10vh auto auto; }
  .search-box { background: var(--card); border: 1px solid var(--seg); border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; }
  .search-box input { width: 100%; font: inherit; font-size: 17px; color: var(--text);
    background: none; border: 0; padding: 17px 20px; outline: 0; }
  .search-box input::placeholder { color: var(--muted); }
  .hits { max-height: min(58vh, 440px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .hits:not(:empty) { border-top: 1px solid var(--seg); }
  .hit { display: flex; gap: 12px; align-items: center; width: 100%; padding: 9px 14px; cursor: pointer;
    font: inherit; color: inherit; text-align: left; background: none; border: 0; }
  .hit:hover, .hit:focus-visible { background: var(--seg); outline: 0; }
  .hit img { flex: none; width: 92px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--seg); }
  .hit-meta { min-width: 0; }
  .hit strong { font-size: 14px; font-weight: 600; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hit small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .hit.watched { opacity: .45; }
  .search-foot { padding: 11px 20px; border-top: 1px solid var(--seg); color: var(--muted); font-size: 12px; }
</style>
<script>
  // antes de pintar, para não dar flash do tema errado
  try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1 id="title">Foco</h1>
      <p id="subtitle"></p>
    </div>
    <div class="top-acoes">
      <button class="search-btn" id="themeBtn"></button>
      <button class="search-btn" id="poolBtn">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><g fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></g></svg>
      </button>
      <button class="search-btn" id="searchBtn" aria-label="Buscar nos seus canais" title="Buscar (⌘K ou /)">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" d="M10.5 3.5a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm4.9 12l5.1 5.1"/></svg>
      </button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <section class="grid" id="grid"></section>
  <div class="end" id="end"></div>
  <footer id="foot"></footer>
</main>

<div class="music" id="music">
  <div class="music-card">
    <div class="music-video"><div id="musicPlayer"></div></div>
    <div class="music-row">
      <div class="music-meta"><strong id="musicTitle"></strong><span id="musicArtist"></span></div>
      <button class="icon-btn" id="musicToggle" aria-label="Tocar ou pausar a música"></button>
      <button class="icon-btn" id="musicMin" aria-label="Minimizar player">–</button>
    </div>
  </div>
  <button class="music-pill" id="musicPill">♪ <span id="musicPillText"></span></button>
</div>

<dialog id="search">
  <div class="search-box">
    <input id="q" type="search" autocomplete="off" autocapitalize="none" spellcheck="false"
      placeholder="Buscar tema nos seus canais…" aria-label="Buscar tema nos seus canais">
    <div class="hits" id="hits"></div>
    <div class="search-foot" id="searchFoot"></div>
  </div>
</dialog>

<dialog id="modal">
  <div class="bar">
    <a class="pill" id="yt" target="_blank" rel="noopener">Abrir no YouTube</a>
    <button class="pill" id="favBtn">☆ Favoritar</button>
    <button class="pill" id="close">Fechar</button>
  </div>
  <div class="player" id="player"></div>
</dialog>

<script src="config.js"></script>
<script>
/* ---------- música de fundo (YouTube IFrame API) ---------- */
(() => {
  const M = (window.CONFIG || {}).musica;
  const root = document.getElementById('music');
  if (!M || !M.videoId) { root.remove(); return; }
  const $ = id => document.getElementById(id);
  const store = { get() { try { return localStorage.getItem('musica'); } catch { return null; } },
                  set(v) { try { localStorage.setItem('musica', v); } catch {} } };   // 'on' | 'off' | 'min'

  const ICON = {
    play:  '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>'
  };
  let player = null, ready = false, playing = false, gesture = false;
  const estado = store.get();
  // em tela estreita começa só com o pill ♪, para não cobrir os cards
  let minimized = estado === 'min' || (!estado && innerWidth < 600);
  let wantPlay = estado !== 'off' && !minimized;

  $('musicTitle').textContent = M.titulo || 'Música';
  $('musicArtist').textContent = M.artista || '';
  $('musicPillText').textContent = M.titulo || 'Música';

  function ui() {
    root.classList.toggle('min', minimized);
    $('musicToggle').innerHTML = playing ? ICON.pause : ICON.play;
  }
  function play() {
    minimized = false; wantPlay = true; store.set('on'); ui();
    if (ready) player.playVideo();
  }
  function pause() { wantPlay = false; store.set('off'); if (ready) player.pauseVideo(); }

  $('musicToggle').onclick = () => (playing ? pause() : play());
  $('musicMin').onclick = () => { if (ready) player.pauseVideo(); wantPlay = false; minimized = true; store.set('min'); ui(); };
  $('musicPill').onclick = play;

  // Navegadores só liberam som depois de uma interação: começa no primeiro clique/toque na página
  addEventListener('pointerdown', () => {
    gesture = true;
    if (ready && wantPlay && !minimized && !playing) player.playVideo();
  }, { once: true, capture: true });
  addEventListener('keydown', () => { gesture = true; }, { once: true, capture: true });

  const prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => {
    if (prev) prev();
    player = new YT.Player('musicPlayer', {
      width: 200, height: 200, videoId: M.videoId,
      playerVars: Object.assign({ controls: 0, rel: 0, modestbranding: 1, playsinline: 1, disablekb: 1,
        fs: 0, iv_load_policy: 3, loop: 1, playlist: M.videoId },
        location.protocol.startsWith('http') ? { origin: location.origin } : {}),
      events: {
        onReady: () => {
          ready = true; player.setVolume(M.volume ?? 40);
          if (gesture && wantPlay && !minimized) player.playVideo();
        },
        onStateChange: e => {
          playing = e.data === 1; ui();
          if (e.data === 0) player.playVideo();       // reforço do loop
        },
        onError: () => {
          $('musicTitle').textContent = 'Música indisponível';
          $('musicArtist').innerHTML = '<a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=' + M.videoId + '">Abrir no YouTube</a>';
        }
      }
    });
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
  ui();

  // usado quando um vídeo do site abre: pausa a música e depois retoma
  window.Musica = {
    suspend() { const was = playing; if (was && ready) player.pauseVideo(); return was; },
    resume(was) { if (was && ready && !minimized) player.playVideo(); }
  };
})();
</script>
<script>
(() => {
  const C = window.CONFIG;
  const $ = id => document.getElementById(id);
  const rtf = new Intl.RelativeTimeFormat('pt-BR', { numeric: 'auto' });
  let results = [];            // [{ nome, videos: [...] }] por categoria
  let failed = [];
  let current = 0, showWatched = false;
  const iFav = C.categorias.length;    // a aba de favoritos vem depois das categorias
  let visao = (() => { try { return localStorage.getItem('visao') || 'grade'; } catch { return 'grade'; } })();

  /* ---------- armazenamento local (vistos + cache) ---------- */
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const watched = () => new Set(ls.get('watched', []));
  const markWatched = id => { const s = watched(); s.add(id); ls.set('watched', [...s].slice(-500)); };

  /* ---------- favoritos: guardam uma cópia do vídeo, para não sumirem quando ele sai do arquivo ---------- */
  const favs = {
    lista: () => ls.get('favoritos', []),
    tem: id => favs.lista().some(v => v.id === id),
    alterna(v) {
      const antes = favs.lista();
      const resto = antes.filter(x => x.id !== v.id);
      if (resto.length === antes.length)
        resto.unshift({ id: v.id, title: v.title, channel: v.channel, published: v.published, cat: v.cat });
      ls.set('favoritos', resto.slice(0, 500));
    }
  };

  /* ---------- busca do RSS via proxy CORS (tenta vários) ---------- */
  // Rede de segurança: só entram se o data.json faltar. (corsproxy.io saiu: passou a exigir chave.)
  const PROXIES = [
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => 'https://r.jina.ai/' + u
  ];

  async function fetchText(url) {
    for (const p of PROXIES) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 9000);
        const r = await fetch(p(url), { signal: ctrl.signal });
        clearTimeout(t);
        if (!r.ok) continue;
        const txt = await r.text();
        if (txt.includes('<feed')) return txt;
      } catch {}
    }
    throw new Error('proxy');
  }

  function parseFeed(xml) {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    return [...doc.getElementsByTagName('entry')].map(e => ({
      id: e.getElementsByTagNameNS('*', 'videoId')[0]?.textContent,
      title: e.getElementsByTagName('title')[0]?.textContent ?? '',
      channel: e.getElementsByTagName('name')[0]?.textContent ?? '',
      published: e.getElementsByTagName('published')[0]?.textContent
    })).filter(v => v.id);
  }

  /* ---------- lista pronta, gerada pela GitHub Action (sem CORS, sem proxy) ---------- */
  let DATA = null;
  async function loadData() {
    try {
      const r = await fetch('data.json', { cache: 'no-cache' });
      if (r.ok) DATA = await r.json();
    } catch {}
  }

  // UULF + (ID do canal sem "UC") = playlist só com vídeos longos, sem Shorts
  async function loadChannel(ch) {
    const pronto = DATA?.canais?.[ch.id];
    if (pronto?.length) return pronto.slice(0, C.porCanal ?? 5);

    const key = 'cache:' + ch.id;
    const cached = ls.get(key, null);
    const ttl = (C.cacheHoras ?? 3) * 36e5;
    if (cached && Date.now() - cached.t < ttl) return cached.videos;

    let videos;
    try {
      try {
        videos = parseFeed(await fetchText('https://www.youtube.com/feeds/videos.xml?playlist_id=UULF' + ch.id.slice(2)));
      } catch { videos = []; }
      if (!videos.length)
        videos = parseFeed(await fetchText('https://www.youtube.com/feeds/videos.xml?channel_id=' + ch.id));
    } catch (e) {
      if (cached) return cached.videos;   // melhor velho do que nada
      throw e;
    }
    videos.sort((a, b) => new Date(b.published) - new Date(a.published));
    videos = videos.slice(0, C.porCanal ?? 5);
    ls.set(key, { t: Date.now(), videos });
    return videos;
  }

  /* ---------- interface ---------- */
  function ago(iso) {
    const days = Math.round((new Date(iso) - Date.now()) / 864e5);
    if (days > -1) return 'hoje';
    if (days > -30) return rtf.format(days, 'day');
    if (days > -365) return rtf.format(Math.round(days / 30), 'month');
    return rtf.format(Math.round(days / 365), 'year');
  }
  function agoCurto(iso) {
    const h = Math.round((new Date(iso) - Date.now()) / 36e5);
    return h > -1 ? 'agora' : h > -24 ? rtf.format(h, 'hour') : ago(iso);
  }

  function renderTabs() {
    $('tabs').innerHTML = '';
    [...C.categorias.map(c => c.nome), '★ Favoritos'].forEach((nome, i) => {
      const b = document.createElement('button');
      b.textContent = nome; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', i === current);
      b.onclick = () => { current = i; showWatched = false; render(); };
      $('tabs').appendChild(b);
    });
  }

  function criaCard(v, seen, ehFav) {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    const el = document.createElement('button');
    el.className = 'card' + (seen.has(v.id) ? ' watched' : '');
    el.innerHTML = '<div class="thumb"><img loading="lazy" alt=""></div><h3></h3><small></small>';
    el.querySelector('img').src = `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
    el.querySelector('h3').textContent = v.title;
    // na raia o nome do canal já está na etiqueta da esquerda
    const meta = [visao === 'raias' ? null : v.channel, ehFav ? v.cat : null, ago(v.published)];
    el.querySelector('small').textContent = meta.filter(Boolean).join(' · ');
    el.onclick = () => openVideo(v.id, v);
    const st = document.createElement('button');
    st.className = 'star' + (favs.tem(v.id) ? ' on' : '');
    st.textContent = '★';
    st.title = favs.tem(v.id) ? 'Remover dos favoritos' : 'Guardar nos favoritos';
    st.setAttribute('aria-label', st.title);
    st.onclick = () => { favs.alterna(v); render(); };
    wrap.append(el, st);
    return wrap;
  }

  function render() {
    renderTabs();
    const seen = watched();
    const ehFav = current === iFav;
    const all = ehFav ? favs.lista() : (results[current]?.videos ?? []);
    // favorito nunca é escondido por já ter sido visto
    const list = (ehFav || showWatched) ? all : all.filter(v => !seen.has(v.id));
    const grid = $('grid');
    grid.innerHTML = '';
    grid.className = visao === 'raias' ? 'raias' : 'grid';

    if (visao === 'raias') {
      const porCanal = new Map();
      list.forEach(v => {
        const k = v.channel || '—';
        if (!porCanal.has(k)) porCanal.set(k, []);
        porCanal.get(k).push(v);
      });
      [...porCanal.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(nome => {
        const raia = document.createElement('div');
        raia.className = 'raia';
        const rot = document.createElement('div');
        rot.className = 'raia-nome';
        rot.textContent = nome;
        const fila = document.createElement('div');
        fila.className = 'raia-fila';
        porCanal.get(nome).forEach(v => fila.appendChild(criaCard(v, seen, ehFav)));
        raia.append(rot, fila);
        grid.appendChild(raia);
      });
    } else {
      list.forEach(v => grid.appendChild(criaCard(v, seen, ehFav)));
    }

    const hidden = ehFav ? 0 : all.length - all.filter(v => !seen.has(v.id)).length;
    $('end').innerHTML = ehFav
      ? (all.length ? '' : '<strong>Nenhum favorito ainda.</strong>Toque na ★ de um vídeo para guardar aqui.')
      : all.length
      ? `<strong>${list.length ? 'Por hoje é isso.' : 'Tudo visto por aqui.'}</strong>Vá viver a vida lá fora.`
      : '';
    if (hidden && !showWatched) {
      const b = document.createElement('button');
      b.textContent = `Mostrar ${hidden} já ${hidden > 1 ? 'vistos' : 'visto'}`;
      b.onclick = () => { showWatched = true; render(); };
      $('end').appendChild(b);
    }
    $('foot').textContent = failed.length
      ? 'Não consegui carregar: ' + failed.join(', ') + '. Tente recarregar.'
      : DATA?.gerado ? 'Lista atualizada ' + agoCurto(DATA.gerado) + '.' : '';
  }

  let musicWas = false, atual = null;
  function atualizaFav() {
    const on = atual && favs.tem(atual.id);
    $('favBtn').textContent = on ? '★ Favoritado' : '☆ Favoritar';
    $('favBtn').classList.toggle('on', !!on);
  }
  $('favBtn').onclick = () => { if (atual) { favs.alterna(atual); atualizaFav(); } };

  function openVideo(id, v) {
    atual = v ?? { id, title: '', channel: '', published: new Date().toISOString() };
    atualizaFav();
    markWatched(id);
    musicWas = window.Musica ? window.Musica.suspend() : false;
    $('yt').href = 'https://www.youtube.com/watch?v=' + id;
    $('player').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&autoplay=1&playsinline=1"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    $('modal').showModal();
  }
  $('modal').addEventListener('close', () => { $('player').innerHTML = ''; if (window.Musica) window.Musica.resume(musicWas); render(); });
  $('close').onclick = () => $('modal').close();
  // de propósito: clique no fundo NÃO fecha o vídeo, para não interromper sem querer

  /* ---------- busca: varre o arquivo inteiro, não só o que está na tela ---------- */
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const palavras = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);

  // Radical bem simples de português: faz "jejum" achar "Jejuar", "acreditar" achar "acreditam".
  // Não é stemmer de verdade, mas resolve o caso de buscar um tema sem acertar a flexão.
  const SUFIXOS = /(?:acoes|coes|mente|idades?|izacao|acao|ando|endo|indo|ad[oa]s|ar|er|ir|am|em|ou|[oaes]s|[oaem])$/;
  function radical(w) {
    let r = w;
    for (let i = 0; i < 2 && r.length > 4; i++) {
      const n = r.replace(SUFIXOS, '');
      if (n === r || n.length < 4) break;
      r = n;
    }
    return r;
  }

  let TODOS = [];

  function indexar() {
    const ids = new Set(); const flat = [];
    const add = (v, cat) => {
      if (!v?.id || ids.has(v.id)) return;
      ids.add(v.id);
      const txt = `${v.title} ${v.channel} ${cat ?? ''}`;
      flat.push({ ...v, cat, tit: norm(v.title), hay: norm(txt), rads: palavras(txt).map(radical) });
    };
    C.categorias.forEach(cat => cat.canais.forEach(ch =>
      (DATA?.canais?.[ch.id] ?? []).forEach(v => add(v, cat.nome))));
    if (!flat.length) results.forEach(r => r.videos.forEach(v => add(v, r.nome)));   // sem data.json
    TODOS = flat.sort((a, b) => new Date(b.published) - new Date(a.published));
  }

  // 3 = no título, 2 = no canal/categoria, 1 = só pelo radical, 0 = não bate
  function bate(e, t) {
    if (e.tit.includes(t)) return 3;
    if (e.hay.includes(t)) return 2;
    const r = radical(t);
    return r.length >= 4 && e.rads.some(x => x.startsWith(r)) ? 1 : 0;
  }

  function buscar(q) {
    const termos = norm(q).split(/\s+/).filter(Boolean);
    if (!termos.length) return [];
    const achados = [];
    for (const e of TODOS) {
      let peso = 0;
      if (termos.every(t => { const p = bate(e, t); peso += p + (e.tit.startsWith(t) ? 2 : 0); return p; }))
        achados.push({ e, peso });
    }
    return achados
      .sort((a, b) => b.peso - a.peso || new Date(b.e.published) - new Date(a.e.published))
      .map(x => x.e);
  }

  const LIMITE_HITS = 60;
  function renderHits() {
    const q = $('q').value.trim();
    const hits = buscar(q);
    const seen = watched();
    $('hits').innerHTML = '';
    hits.slice(0, LIMITE_HITS).forEach(v => {
      const b = document.createElement('button');
      b.className = 'hit' + (seen.has(v.id) ? ' watched' : '');
      b.innerHTML = '<img loading="lazy" alt=""><div class="hit-meta"><strong></strong><small></small></div>';
      b.querySelector('img').src = `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`;
      b.querySelector('strong').textContent = v.title;
      b.querySelector('small').textContent = [v.channel, v.cat, ago(v.published)].filter(Boolean).join(' · ');
      b.onclick = () => { $('search').close(); openVideo(v.id, v); };
      $('hits').appendChild(b);
    });
    $('searchFoot').textContent = !q
      ? `${TODOS.length} vídeos no arquivo. Tema, canal ou palavra do título.`
      : !hits.length ? 'Nada encontrado.'
      : `${hits.length} resultado${hits.length > 1 ? 's' : ''}` +
        (hits.length > LIMITE_HITS ? ` · mostrando ${LIMITE_HITS}` : '');
  }

  function abrirBusca() {
    if (!TODOS.length) indexar();
    if (!$('search').open) $('search').showModal();
    $('q').select();
    renderHits();
  }

  /* ---------- tema: segue o navegador por padrão, mas dá para travar ---------- */
  const TEMAS = ['auto', 'light', 'dark'];
  const ROTULO = { auto: 'Tema: segue o navegador', light: 'Tema: claro', dark: 'Tema: escuro' };
  const ICONE = { auto: '◐', light: '☀', dark: '☾' };
  const temaAtual = () => { try { return localStorage.getItem('tema') || 'auto'; } catch { return 'auto'; } };

  function aplicaTema(t) {
    try { t === 'auto' ? localStorage.removeItem('tema') : localStorage.setItem('tema', t); } catch {}
    if (t === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    $('themeBtn').textContent = ICONE[t];
    $('themeBtn').title = ROTULO[t];
    $('themeBtn').setAttribute('aria-label', ROTULO[t]);
  }
  $('themeBtn').onclick = () => aplicaTema(TEMAS[(TEMAS.indexOf(temaAtual()) + 1) % TEMAS.length]);
  aplicaTema(temaAtual());

  function aplicaVisao(v) {
    visao = v;
    try { v === 'grade' ? localStorage.removeItem('visao') : localStorage.setItem('visao', v); } catch {}
    const rotulo = v === 'raias' ? 'Agrupado por canal' : 'Agrupar por canal';
    $('poolBtn').classList.toggle('on', v === 'raias');
    $('poolBtn').title = rotulo;
    $('poolBtn').setAttribute('aria-label', rotulo);
    $('poolBtn').setAttribute('aria-pressed', String(v === 'raias'));
  }
  $('poolBtn').onclick = () => { aplicaVisao(visao === 'raias' ? 'grade' : 'raias'); render(); };
  aplicaVisao(visao);

  $('searchBtn').onclick = abrirBusca;
  $('q').oninput = renderHits;
  $('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('hits').querySelector('.hit')?.click(); }
  });
  $('search').addEventListener('click', e => { if (e.target === $('search')) $('search').close(); });
  $('search').addEventListener('close', () => render());   // atualiza os "vistos" no grid
  addEventListener('keydown', e => {
    const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); abrirBusca(); }
    else if (e.key === '/' && !digitando && !$('search').open) { e.preventDefault(); abrirBusca(); }
  });

  /* ---------- início ---------- */
  document.title = C.titulo || 'Foco';
  $('title').textContent = C.titulo || 'Foco';
  $('subtitle').textContent = C.subtitulo || '';
  renderTabs();
  $('grid').innerHTML = '<p class="msg">Carregando…</p>';

  /* ---------- favoritos vindos do config: entram uma vez só ---------- */
  function semearFavoritos() {
    const iniciais = C.favoritosIniciais ?? [];
    if (!iniciais.length) return;
    const feitos = new Set(ls.get('favSemeados', []));
    let mudou = false;
    iniciais.forEach(v => {
      if (!v?.id || feitos.has(v.id)) return;
      feitos.add(v.id);
      mudou = true;
      if (!favs.tem(v.id)) favs.alterna(v);   // respeitando remoção posterior
    });
    if (mudou) ls.set('favSemeados', [...feitos]);
  }

  (async () => {
    semearFavoritos();
    await loadData();
    results = await Promise.all(C.categorias.map(async cat => {
      const settled = await Promise.all(cat.canais.map(ch =>
        loadChannel(ch).catch(() => { failed.push(ch.nome || ch.id); return []; })));
      const videos = settled.flat().sort((a, b) => new Date(b.published) - new Date(a.published));
      return { nome: cat.nome, videos };
    }));
    render();
    indexar();
  })();
})();
</script>
